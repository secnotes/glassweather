name: Release Desktop App

# 推送 v* tag 时构建桌面安装包并发布到 GitHub Releases
# Windows: .msi + NSIS .exe；Linux: .deb + .AppImage（网页版 GitHub Pages 不受影响）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if tag does not match Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')
          if [ "$TAG" != "$CARGO_VER" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CARGO_VER"; exit 1
          fi

  build-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: npm install

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GlassWeather ${{ github.ref_name }}'
          releaseBody: 'Desktop installers. Windows: .msi/.exe; Linux: .deb/.rpm/AppImage. Pick the one for your platform.'
          releaseDraft: true
          prerelease: false

      # 免安装版：打 zip 附加到 Release（下载解压即用，无安装过程）。
      # deskband11lib.dll 是运行时依赖（Win11 任务栏天气功能加载），必须与 exe
      # 同目录，因此与 exe 一起进 zip——单发 exe 会静默缺失任务栏天气功能。
      - name: Attach portable zip
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir portable
          cp src-tauri/target/release/glassweather.exe portable/
          cp src-tauri/target/release/deskband11lib.dll portable/
          powershell Compress-Archive portable "GlassWeather_${{ github.ref_name }}_x64_portable.zip"
          gh release upload "${{ github.ref_name }}" "GlassWeather_${{ github.ref_name }}_x64_portable.zip" --clobber
        shell: bash

  build-linux:
    needs: check-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: npm install

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GlassWeather ${{ github.ref_name }}'
          releaseBody: 'Desktop installers. Windows: .msi/.exe; Linux: .deb/.rpm/AppImage. Pick the one for your platform.'
          releaseDraft: true
          prerelease: false
