<!DOCTYPE html>
<!--
  桌面版 Windows 11 任务栏天气（deskband，Tauri 专用；网页版不加载本文件）。
  由 tauri-plugin-deskband11lib 挂进任务栏空余区（任务栏按钮与通知区之间），
  尺寸由任务栏布局决定（preferred_width ≈ 150px），内容填满即可，勿自设大小。
  与主窗口同源，直接读 localStorage('weather:tray') 渲染，无网络请求；
  storage 事件 + 定时轮询双通道刷新。点击打开主窗口。
  主题跟随任务栏（Windows 模式）：用 prefers-color-scheme 双配色自适应。
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { height: 100vh; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", system-ui, sans-serif;
    color: #f5f7fa;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    cursor: pointer;
    height: 100%;
  }
  .emoji { font-size: 18px; line-height: 1; }
  .temp { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .range { font-size: 11px; opacity: 0.62; white-space: nowrap; }
  .empty { font-size: 12px; opacity: 0.55; }
  /* 浅色任务栏（Windows 系统浅色模式）时换深色字。data-theme 由 Rust 侧读注册表
     SystemUsesLightTheme 注入（任务栏跟随 Windows 模式，而 WebView2 的
     prefers-color-scheme 反映应用模式——两者可独立设置）；CSS 媒体查询仅兜底。 */
  html[data-theme='light'] body { color: #1c2430; }
  @media (prefers-color-scheme: light) {
    html:not([data-theme]) body { color: #1c2430; }
  }
</style>
</head>
<body>
  <div id="bar" style="display:none">
    <span class="emoji" id="emoji"></span>
    <span class="temp" id="temp"></span>
    <span class="range" id="range"></span>
  </div>
  <div class="empty" id="empty">…</div>

<script>
'use strict';
function render(s) {
  if (!s) return;
  document.getElementById('empty').style.display = 'none';
  document.getElementById('bar').style.display = '';
  document.getElementById('emoji').textContent = s.emoji;
  document.getElementById('temp').textContent = s.temp + '°';
  document.getElementById('range').textContent = s.tmin + '° ~ ' + s.tmax + '°';
}
function readOnce() {
  try {
    var raw = localStorage.getItem('weather:tray');
    if (raw) render(JSON.parse(raw));
  } catch (e) {}
}
window.addEventListener('storage', function (e) { if (e.key === 'weather:tray') readOnce(); });
setInterval(readOnce, 1500);
readOnce();

/* 点击任务栏天气 → 打开主窗口（监听绑在 document 上，任务栏宿主窗口里
   body 未必铺满/未必收到事件；全局 API 未就绪时短暂重试） */
document.addEventListener('click', function () {
  var n = 0;
  (function ping() {
    var g = window.__TAURI__;
    if (g && g.core && typeof g.core.invoke === 'function') {
      try { g.core.invoke('popup_clicked').catch(function () {}); } catch (e) {}
      return;
    }
    if (n++ < 40) setTimeout(ping, 250);
  })();
});
</script>
</body>
</html>
